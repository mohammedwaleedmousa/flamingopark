name: Apply catalog server filtering patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-catalog-server-filtering.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply catalog patch
        run: python scripts/apply_catalog_server_filtering_patch.py

      - name: Verify patch
        run: |
          test -z "$(grep -n 'META_BATCH_SIZE' src/pages/ProductsPageBase.tsx || true)"
          test -z "$(grep -n 'matchingMetadata' src/pages/ProductsPageBase.tsx || true)"
          grep -q 'catalog_filter_product_ids' src/pages/ProductsPageBase.tsx
          grep -q 'catalog_filter_facets' src/pages/ProductsPageBase.tsx

      - name: Commit optimized catalog page
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ProductsPageBase.tsx
          git commit -m 'Use server-side catalog filtering'
          git push origin main
