name: Apply Launch Source Fixes

on:
  push:
    branches:
      - agent/fix-launch-readiness-without-password

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-launch-readiness-without-password
          fetch-depth: 0

      - name: Apply exact source replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          product = Path('src/pages/ProductDetailPage.tsx')
          text = product.read_text(encoding='utf-8')
          old_domain = 'const siteUrl = "https://flamingopark.store";'
          assert text.count(old_domain) == 1, 'Unexpected ProductDetail siteUrl shape'
          text = text.replace(old_domain, 'const siteUrl = "https://flamingoparkaden.com";', 1)
          old_currency = 'priceCurrency: "YER",'
          assert text.count(old_currency) == 1, 'Unexpected ProductDetail priceCurrency shape'
          text = text.replace(old_currency, 'priceCurrency: "SAR",', 1)
          product.write_text(text, encoding='utf-8')

          payments = Path('src/pages/admin/AdminPaymentMethodsPage.tsx')
          text = payments.read_text(encoding='utf-8')
          card = '                    <SelectItem value="card">بطاقة</SelectItem>\n'
          wallet = '                    <SelectItem value="wallet">محفظة إلكترونية</SelectItem>\n'
          assert text.count(card) == 2, f'Expected 2 card options, found {text.count(card)}'
          assert text.count(wallet) == 2, f'Expected 2 wallet options, found {text.count(wallet)}'
          text = text.replace(card, '')
          text = text.replace(wallet, '')

          anchor = '      if (!nameAr) throw new Error("الاسم العربي مطلوب.");\n'
          assert text.count(anchor) == 1, 'Unexpected payment validation shape'
          validation = '''      if (!["cash", "bank"].includes(methodForm.type)) throw new Error("نوع الدفع غير مدعوم في صفحة الدفع الحالية.");
      if (methodForm.type === "bank" && code !== "bank") throw new Error("كود التحويل البنكي يجب أن يكون bank حتى يتوافق مع صفحة الدفع.");
      if (methodForm.type === "cash" && !["cash", "cod"].includes(code)) throw new Error("كود الدفع النقدي يجب أن يكون cash أو cod حتى يتوافق مع صفحة الدفع.");
'''
          text = text.replace(anchor, anchor + validation, 1)
          text = text.replace('placeholder="cod أو transfer"', 'placeholder="cash أو cod أو bank"', 1)
          payments.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/apply-launch-source-fixes.yml

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProductDetailPage.tsx src/pages/admin/AdminPaymentMethodsPage.tsx .github/workflows/apply-launch-source-fixes.yml
          git commit -m "Fix launch SEO and payment method compatibility"
          git push origin HEAD:agent/fix-launch-readiness-without-password
