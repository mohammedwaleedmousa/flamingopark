name: Customer functional patch
on:
  push:
    branches: [agent/customer-functional-fixes]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-functional-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch customer storefront
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Products Quick View: require size and respect selected SKU stock.
          replace_once('src/pages/ProductsPage.tsx', 'import { useSiteContent, getSiteText } from "@/hooks/useSiteContent";\n', 'import { useSiteContent, getSiteText } from "@/hooks/useSiteContent";\nimport { toast } from "@/hooks/use-toast";\n')
          replace_once('src/pages/ProductsPage.tsx', '''  const handleAdd = () => {\n    addToCart(product, qty, selectedSize ?? undefined, undefined, activeVariant?.id, activeVariant?.colorName || activeVariant?.name);\n    onClose();\n  };''', '''  const handleAdd = () => {\n    if (sizesForActiveVariant.length > 0 && !selectedSize) {\n      toast({ title: "اختر المقاس", description: "حدد المقاس قبل إضافة المنتج للسلة.", variant: "destructive" });\n      return;\n    }\n\n    const activeStock = selectedSize ? stockForSize(selectedSize) : typeof product.stockQuantity === "number" ? product.stockQuantity : product.inStock ? 999 : 0;\n    if (activeStock <= 0 || qty > activeStock) {\n      toast({ title: "الكمية غير متوفرة", description: "اختر كمية متاحة من هذا المنتج.", variant: "destructive" });\n      return;\n    }\n\n    addToCart(product, qty, selectedSize ?? undefined, undefined, activeVariant?.id, activeVariant?.colorName || activeVariant?.name);\n    onClose();\n  };''')
          replace_once('src/pages/ProductsPage.tsx', '<button onClick={() => setQty(qty + 1)} className="h-full w-10 text-lg">+</button>', '<button onClick={() => { const max = selectedSize ? stockForSize(selectedSize) : typeof product.stockQuantity === "number" ? product.stockQuantity : 999; setQty(Math.min(qty + 1, Math.max(1, max))); }} className="h-full w-10 text-lg">+</button>')

          # Categories: load all brand names for the current category scope, not only the first loaded product page.
          replace_once('src/pages/CategoriesPage.tsx', '''  /* =========================================================\n     AVAILABLE BRANDS\n\n     يعتمد على المنتجات المحملة الحالية، بدون طلب ثقيل إضافي.\n  ========================================================= */\n\n  const availableBrands = useMemo(() => {\n    return Array.from(new Set(products.map((product) => product.brand?.trim()).filter((brand): brand is string => Boolean(brand)))).sort((a, b) => a.localeCompare(b, "ar"));\n  }, [products]);''', '''  /* =========================================================\n     AVAILABLE BRANDS\n\n     طلب خفيف لأسماء الماركات في كامل نطاق القسم حتى لا تعتمد\n     الفلاتر على أول 24 منتجاً فقط.\n  ========================================================= */\n\n  const brandScopeKey = useMemo(() => [scopedCategoryIds.join(","), productQuery, inStockOnly ? "1" : "0", minPrice, maxPrice].join("|"), [scopedCategoryIds, productQuery, inStockOnly, minPrice, maxPrice]);\n\n  const { data: availableBrands = [] } = useQuery({\n    queryKey: ["category-available-brands", brandScopeKey],\n    enabled: scopedCategoryIds.length > 0,\n    queryFn: async () => {\n      const brands = new Set<string>();\n      const batchSize = 1000;\n\n      for (let page = 0; page < 20; page += 1) {\n        let query = supabase.from("products").select("brand").eq("is_active", true).in("category_id", scopedCategoryIds);\n        if (productQuery.trim()) { const term = productQuery.trim(); query = query.or(`name_ar.ilike.%${term}%,name.ilike.%${term}%,description_ar.ilike.%${term}%`); }\n        if (inStockOnly) query = query.eq("in_stock", true);\n        if (Number(minPrice) > 0) query = query.gte("price", Number(minPrice));\n        if (Number(maxPrice) > 0) query = query.lte("price", Number(maxPrice));\n\n        const from = page * batchSize;\n        const { data, error } = await query.range(from, from + batchSize - 1);\n        if (error) throw error;\n        (data || []).forEach((row: any) => { const brand = String(row.brand || "").trim(); if (brand) brands.add(brand); });\n        if ((data || []).length < batchSize) break;\n      }\n\n      return Array.from(brands).sort((a, b) => a.localeCompare(b, "ar"));\n    },\n    staleTime: 5 * 60 * 1000,\n    gcTime: 20 * 60 * 1000,\n    refetchOnWindowFocus: false,\n  });''')

          # Checkout: do not expose all coupon codes; use one-code RPC and calculate UI discount from sale subtotal.
          replace_once('src/pages/CheckoutPage.tsx', 'import { optimizeImage, handleImageError } from "@/lib/imageUrl";\n', 'import { optimizeImage, handleImageError } from "@/lib/imageUrl";\nimport { useCurrency } from "@/lib/currency";\n')
          replace_once('src/pages/CheckoutPage.tsx', '  const subtotal = getCartTotal();\n  const currency = "ر.ي";\n', '  const subtotal = getCartTotal();\n  const { format: formatCurrency, symbol: currency } = useCurrency();\n')
          replace_once('src/pages/CheckoutPage.tsx', '''  /* =========================================================\n     COST TOTAL\n  ========================================================= */\n\n  const getCostPriceTotal = () => {\n    return cart.reduce((totalCost, item) => {\n      const costPrice = item.product.costPrice || item.product.price;\n      const accessoriesTotal = item.selectedAccessories?.reduce((sum, accessory) => sum + accessory.price * accessory.quantity, 0) || 0;\n\n      return totalCost + (costPrice + accessoriesTotal) * item.quantity;\n    }, 0);\n  };\n\n''', '')
          old_coupon = '''    const costPriceTotal = getCostPriceTotal();\n\n    try {\n      const { data: couponData, error } = await supabase.from("coupons").select("code,type,value").eq("is_active", true).limit(100);\n\n      if (error) throw error;\n\n      const match = couponData?.find((coupon) => coupon.code?.trim().toUpperCase() === normalized);\n\n      if (!match) {\n        setDiscountAmount(0);\n        setAppliedCoupon(null);\n\n        toast({\n          title: "الكود غير صالح",\n          description: "كود الخصم غير موجود.",\n          variant: "destructive",\n        });\n\n        return;\n      }\n\n      const coupon = match as {\n        type: "percentage" | "fixed";\n        value: number;\n      };\n\n      let discount = coupon.type === "percentage" ? (costPriceTotal * coupon.value) / 100 : coupon.value;\n\n      discount = Math.min(discount, subtotal);'''
          new_coupon = '''    try {\n      const { data, error } = await (supabase as any).rpc("validate_customer_coupon", { p_code: normalized });\n      if (error) throw error;\n\n      if (!data?.valid) {\n        setDiscountAmount(0);\n        setAppliedCoupon(null);\n        toast({ title: "الكود غير صالح", description: "كود الخصم غير موجود أو غير فعال.", variant: "destructive" });\n        return;\n      }\n\n      const value = Number(data.value) || 0;\n      let discount = data.type === "percentage" ? (subtotal * value) / 100 : value;\n      discount = Math.min(discount, subtotal);'''
          replace_once('src/pages/CheckoutPage.tsx', old_coupon, new_coupon)
          replace_once('src/pages/CheckoutPage.tsx', 'description: `خصم ${discount.toFixed(2)} ${currency}`,', 'description: `خصم ${formatCurrency(discount)}`,')
          replace_once('src/pages/CheckoutPage.tsx', '<span>{subtotal.toFixed(2)} {currency}</span>', '<span>{formatCurrency(subtotal)}</span>')
          replace_once('src/pages/CheckoutPage.tsx', '<span>{deliveryFee > 0 ? `${deliveryFee.toFixed(2)} ${currency}` : "—"}</span>', '<span>{deliveryFee > 0 ? formatCurrency(deliveryFee) : "—"}</span>')
          replace_once('src/pages/CheckoutPage.tsx', '<span>-{discountAmount.toFixed(2)} {currency}</span>', '<span>-{formatCurrency(discountAmount)}</span>')
          replace_once('src/pages/CheckoutPage.tsx', '<span className="text-[15px] font-bold text-[#B86168]">{total.toFixed(2)} {currency}</span>', '<span className="text-[15px] font-bold text-[#B86168]">{formatCurrency(total)}</span>')

          # Cart: use the same global currency formatter as product cards.
          replace_once('src/pages/CartPage.tsx', 'import { useSiteContent, getSiteText } from "@/hooks/useSiteContent";\n', 'import { useSiteContent, getSiteText } from "@/hooks/useSiteContent";\nimport { useCurrency } from "@/lib/currency";\n')
          replace_once('src/pages/CartPage.tsx', '  const currency = "ر.ي";\n  const total = getCartTotal();', '  const { format: formatCurrency } = useCurrency();\n  const total = getCartTotal();')
          for old, new in [
              ('{total.toFixed(0)} {currency}', '{formatCurrency(total)}'),
              ('{unitTotal.toFixed(0)} {currency}', '{formatCurrency(unitTotal)}'),
              ('{itemTotal.toFixed(0)} {currency}', '{formatCurrency(itemTotal)}'),
              ('{basePrice.toFixed(0)}', '{formatCurrency(basePrice)}'),
          ]:
              text = Path('src/pages/CartPage.tsx').read_text(encoding='utf-8')
              if old in text:
                  Path('src/pages/CartPage.tsx').write_text(text.replace(old, new), encoding='utf-8')
          text = Path('src/pages/CartPage.tsx').read_text(encoding='utf-8')
          text = text.replace('<span className="text-[23px] font-semibold leading-none text-[#B95E66]">{total.toFixed(0)}</span>\n                    <span className="mr-1 text-[8px] font-medium text-[#8D7975]">{currency}</span>', '<span className="text-[23px] font-semibold leading-none text-[#B95E66]">{formatCurrency(total)}</span>')
          Path('src/pages/CartPage.tsx').write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProductsPage.tsx src/pages/CategoriesPage.tsx src/pages/CheckoutPage.tsx src/pages/CartPage.tsx
          git diff --cached --check
          git commit -m "Fix customer catalog and checkout flows"
          git push origin HEAD:agent/customer-functional-fixes
