name: Launch final UX verify
on:
  push:
    branches: [agent/launch-readiness-final]
permissions:
  contents: write
jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[launch-ux-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch checkout launch UX
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/pages/CheckoutPage.tsx')
          s = p.read_text()
          old = '''    const { error } = await (supabase as any).from("customer_addresses").upsert({ id: draft.id, user_id: customer.id, label: draft.label, recipient_name: draft.name, phone: draft.phone, city: draft.city, address_line1: draft.address, notes: draft.notes || null, is_default: draft.isDefault }).select("id").single();\n    if (error) throw error;'''
          new = '''    const { error } = await (supabase as any).from("customer_addresses").upsert({ id: draft.id, user_id: customer.id, label: draft.label, recipient_name: draft.name, phone: draft.phone, city: draft.city, address_line1: draft.address, notes: draft.notes || null, is_default: draft.isDefault }).select("id").single();\n    if (error) console.warn("ADDRESS SAVE ERROR:", error);'''
          assert old in s, 'address save block not found'
          s = s.replace(old, new, 1)

          old = '''    } catch (error) {\n      const message = error instanceof Error ? error.message : "فشل إرسال الطلب";\n\n      toast({\n        title: "تعذر إنشاء الطلب",\n        description: message,\n        variant: "destructive",\n      });'''
          new = '''    } catch (error) {\n      const rawMessage = error instanceof Error ? error.message : "فشل إرسال الطلب";\n      const message = rawMessage.includes("invalid_yemen_phone")\n        ? "أدخل رقم جوال يمني صحيح."\n        : rawMessage.includes("order_rate_limit")\n          ? "تم إرسال عدة طلبات خلال فترة قصيرة. حاول مرة أخرى بعد قليل."\n          : rawMessage.includes("guest_order_capacity_limit")\n            ? "إنشاء الطلبات غير متاح مؤقتاً بسبب عدد كبير من المحاولات. حاول بعد قليل."\n            : rawMessage.includes("insufficient_stock")\n              ? "تغير مخزون أحد المنتجات في السلة. راجع الكمية وحاول مرة أخرى."\n              : rawMessage.includes("variant_selection_required")\n                ? "تحقق من اختيار المقاس أو اللون لجميع المنتجات."\n                : rawMessage.includes("invalid_coupon")\n                  ? "كود الخصم لم يعد صالحاً. أزله أو جرّب كوداً آخر."\n                  : rawMessage.includes("invalid_delivery_company") || rawMessage.includes("delivery_company_required")\n                    ? "شركة التوصيل المختارة غير متاحة حالياً. اختر شركة توصيل أخرى."\n                    : rawMessage;\n\n      toast({\n        title: "تعذر إنشاء الطلب",\n        description: message,\n        variant: "destructive",\n      });'''
          assert old in s, 'checkout error block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CheckoutPage.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "Polish launch checkout failure handling [launch-ux-final]"
          git push origin HEAD:agent/launch-readiness-final
