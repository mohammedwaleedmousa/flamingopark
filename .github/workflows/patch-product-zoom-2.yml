name: Apply zoom fix
on:
  push:
    branches: [fix/product-zoom-persistence]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch zoom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ProductDetailPage.tsx')
          s = p.read_text()
          marker = '  const [openSection, setOpenSection] = useState<"specs" | "return" | "delivery" | null>(null);'
          if 'const [imageScale, setImageScale]' not in s:
              s = s.replace(marker, marker + '\n  const [imageScale, setImageScale] = useState(1);', 1)
          old = 'drag={displayImages.length > 1 ? "x" : false}'
          s = s.replace(old, 'drag={imageScale <= 1.01 && displayImages.length > 1 ? "x" : false}', 1)
          s = s.replace('if (displayImages.length <= 1) return; if (info.offset.x < -55', 'if (imageScale > 1.01 || displayImages.length <= 1) return; if (info.offset.x < -55', 1)
          s = s.replace('style={{ touchAction: "pan-y" }} className="h-full w-full cursor-grab active:cursor-grabbing"', 'style={{ touchAction: imageScale > 1.01 ? "none" : "pan-y" }} className={`h-full w-full ${imageScale > 1.01 ? "cursor-move" : "cursor-grab active:cursor-grabbing"}`}', 1)
          s = s.replace('<TransformWrapper minScale={1} maxScale={4} centerOnInit centerZoomedOut limitToBounds panning={{ disabled: true }} wheel={{ disabled: true }} doubleClick={{ disabled: true }}>', '<TransformWrapper key={currentImage} minScale={1} maxScale={4} centerOnInit centerZoomedOut limitToBounds panning={{ disabled: imageScale <= 1.01 }} wheel={{ disabled: true }} doubleClick={{ disabled: true }} onTransformed={(_, state) => setImageScale(state.scale)} onInit={() => setImageScale(1)}>', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProductDetailPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize product image zoom"
          git push
