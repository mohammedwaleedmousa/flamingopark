name: Patch product zoom

on:
  push:
    branches:
      - fix/product-zoom-persistence

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[zoom-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-zoom-persistence
          fetch-depth: 0
      - name: Patch ProductDetailPage zoom interaction
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/ProductDetailPage.tsx')
          text = path.read_text(encoding='utf-8')

          state_old = '  const [openSection, setOpenSection] = useState<"specs" | "return" | "delivery" | null>(null);'
          state_new = state_old + '\n  const [imageScale, setImageScale] = useState(1);'
          if state_old not in text:
              raise SystemExit('zoom state insertion point not found')
          text = text.replace(state_old, state_new, 1)

          old = '''  <motion.div key={`${activeColorVariant?.name || "default"}-${selectedQualityIdx ?? "default"}-${safeSelectedImage}`} initial={{ opacity: 0.65 }} animate={{ opacity: 1 }} transition={{ duration: 0.14 }} drag={displayImages.length > 1 ? "x" : false} dragConstraints={{ left: 0, right: 0 }} dragElastic={0.1} dragMomentum={false} onDragEnd={(_, info) => { if (displayImages.length <= 1) return; if (info.offset.x < -55 || info.velocity.x < -450) { prevImage(); return; } if (info.offset.x > 55 || info.velocity.x > 450) { nextImage(); } }} style={{ touchAction: "pan-y" }} className="h-full w-full cursor-grab active:cursor-grabbing">
    <TransformWrapper minScale={1} maxScale={4} centerOnInit centerZoomedOut limitToBounds panning={{ disabled: true }} wheel={{ disabled: true }} doubleClick={{ disabled: true }}>
      <TransformComponent wrapperClass="!h-full !w-full !overflow-hidden" contentClass="!h-full !w-full">
        <img src={optimizeImage(currentImage, 1400, 84)} alt={product.nameAr || product.name} fetchPriority="high" decoding="async" onError={handleImageError} draggable={false} className="h-full w-full select-none object-cover object-bottom" />
      </TransformComponent>
    </TransformWrapper>
  </motion.div>'''

          new = '''  <motion.div key={`${activeColorVariant?.name || "default"}-${selectedQualityIdx ?? "default"}-${safeSelectedImage}`} initial={{ opacity: 0.65 }} animate={{ opacity: 1 }} transition={{ duration: 0.14 }} drag={imageScale <= 1.01 && displayImages.length > 1 ? "x" : false} dragConstraints={{ left: 0, right: 0 }} dragElastic={0.1} dragMomentum={false} onDragEnd={(_, info) => { if (imageScale > 1.01 || displayImages.length <= 1) return; if (info.offset.x < -55 || info.velocity.x < -450) { prevImage(); return; } if (info.offset.x > 55 || info.velocity.x > 450) { nextImage(); } }} style={{ touchAction: imageScale > 1.01 ? "none" : "pan-y" }} className={`h-full w-full ${imageScale > 1.01 ? "cursor-move" : "cursor-grab active:cursor-grabbing"}`}>
    <TransformWrapper key={currentImage} minScale={1} maxScale={4} centerOnInit centerZoomedOut limitToBounds panning={{ disabled: imageScale <= 1.01 }} wheel={{ disabled: true }} doubleClick={{ disabled: true }} onTransformed={(_, state) => setImageScale(state.scale)} onInit={() => setImageScale(1)}>
      <TransformComponent wrapperClass="!h-full !w-full !overflow-hidden" contentClass="!h-full !w-full">
        <img src={optimizeImage(currentImage, 1400, 84)} alt={product.nameAr || product.name} fetchPriority="high" decoding="async" onError={handleImageError} draggable={false} className="h-full w-full select-none object-cover object-bottom" />
      </TransformComponent>
    </TransformWrapper>
  </motion.div>'''

          if old not in text:
              raise SystemExit('zoom gallery block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProductDetailPage.tsx
          git commit -m "fix: keep product zoom active [zoom-fix]"
          git push origin HEAD:fix/product-zoom-persistence
