name: security-hardening-dependencies
on:
  push:
    branches:
      - agent/security-hardening-final
permissions:
  contents: write
jobs:
  repair-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-hardening-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove unused vulnerable spreadsheet package
        run: npm uninstall xlsx
      - name: Apply safe transitive security updates
        run: npm audit fix || true
      - name: Upgrade React Router past security advisories
        run: npm install react-router-dom@7.18.0
      - name: Verify production dependencies
        run: npm audit --omit=dev
      - run: npm run build
      - name: Commit verified dependency repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Remove vulnerable unused dependency and update secure runtime packages"
          git push origin HEAD:agent/security-hardening-final
