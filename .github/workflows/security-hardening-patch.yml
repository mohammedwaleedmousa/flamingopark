name: security-hardening-audit
on:
  push:
    branches:
      - agent/security-hardening-final
permissions:
  contents: read
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev || true
      - name: Full dependency audit
        run: npm audit || true
      - run: npm run build
