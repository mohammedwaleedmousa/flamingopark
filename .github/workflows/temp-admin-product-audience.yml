name: Temporary admin product audience

on:
  push:
    branches:
      - fix/admin-product-audience-only

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-product-audience-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python .github/scripts/apply_admin_product_audience_only.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminProductFormPage.tsx src/pages/CategoriesPage.tsx supabase/migrations/20260817195000_add_product_audience_for_admin.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add admin product audience selector"
          git push origin HEAD:fix/admin-product-audience-only
