name: Temporary admin product save and position fix

on:
  push:
    branches:
      - fix/admin-product-save-return-position

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/admin-product-save-return-position

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/admin/AdminProductFormPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = "      !formData.audience && 'قسم الظهور',\n"
          if old not in s: raise SystemExit('audience validation anchor not found')
          s = s.replace(old, '', 1)
          old = "      audience: formData.audience,\n"
          if old not in s: raise SystemExit('audience payload anchor not found')
          s = s.replace(old, "      audience: formData.audience || null,\n", 1)
          old = "        if (savedProduct.category_id !== selectedCat?.id) {\n"
          if old not in s: raise SystemExit('category verification anchor not found')
          s = s.replace(old, "        if (selectedCat && savedProduct.category_id !== selectedCat.id) {\n", 1)
          s = s.replace('قسم ظهور المنتج *</label>', 'قسم ظهور المنتج (اختياري)</label>', 1)
          s = s.replace('<Select value={formData.audience} onValueChange={(value) => setFormData((current) => ({ ...current, audience: value as \'men\' | \'women\' | \'kids\' | \'unisex\' }))}>', '<Select value={formData.audience || \'none\'} onValueChange={(value) => setFormData((current) => ({ ...current, audience: value === \'none\' ? \'\' : value as \'men\' | \'women\' | \'kids\' | \'unisex\' }))}>', 1)
          s = s.replace('<SelectContent>\n                  <SelectItem value="men">رجالي</SelectItem>', '<SelectContent>\n                  <SelectItem value="none">غير محدد</SelectItem>\n                  <SelectItem value="men">رجالي</SelectItem>', 1)
          s = s.replace('لا يغيّر الفئة؛ يحدد فقط القسم الذي يظهر فيه المنتج للعميل.</p>', 'يمكن تركه غير محدد للمنتجات القديمة؛ اختيارك هنا لا يغيّر الفئة.</p>', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/pages/admin/AdminProductsPage.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useMemo, useRef, useState } from "react";', 1)
          old = '  const [page, setPage] = useState(1);\n  const [isLoading, setIsLoading] = useState(true);\n\n  const [searchInput, setSearchInput] = useState("");'
          new = '  const [page, setPage] = useState(() => {\n    const saved = Number(sessionStorage.getItem("admin-products-page") || 1);\n    return Number.isFinite(saved) && saved > 0 ? Math.floor(saved) : 1;\n  });\n  const [isLoading, setIsLoading] = useState(true);\n\n  const [searchInput, setSearchInput] = useState(() => sessionStorage.getItem("admin-products-search") || "");'
          if old not in s: raise SystemExit('page state anchor not found')
          s = s.replace(old, new, 1)
          old = '  useEffect(() => {\n    setPage(1);\n  }, [search, status, stock, categoryFilter, brandFilter]);'
          new = '  const didHydrateFilters = useRef(false);\n\n  useEffect(() => {\n    if (!didHydrateFilters.current) { didHydrateFilters.current = true; return; }\n    setPage(1);\n  }, [search, status, stock, categoryFilter, brandFilter]);\n\n  useEffect(() => { sessionStorage.setItem("admin-products-page", String(page)); }, [page]);\n  useEffect(() => { sessionStorage.setItem("admin-products-search", searchInput); }, [searchInput]);'
          if old not in s: raise SystemExit('page reset anchor not found')
          s = s.replace(old, new, 1)
          anchor = '  const clearFilters = () => {\n    setSearchInput("");\n    setStatus("all");\n    setStock("all");\n    setCategoryFilter("all");\n    setBrandFilter("all");\n  };'
          insert = anchor + '\n\n  const rememberProductPosition = (productId: string) => {\n    sessionStorage.setItem("admin-products-page", String(page));\n    sessionStorage.setItem("admin-products-search", searchInput);\n    sessionStorage.setItem("admin-products-return-id", productId);\n    sessionStorage.setItem("admin-products-return-scroll", String(window.scrollY));\n  };\n\n  useEffect(() => {\n    if (isLoading || products.length === 0) return;\n    const returnId = sessionStorage.getItem("admin-products-return-id");\n    if (!returnId || !products.some((product) => product.id === returnId)) return;\n    const savedScroll = Number(sessionStorage.getItem("admin-products-return-scroll") || 0);\n    requestAnimationFrame(() => { requestAnimationFrame(() => {\n      const target = Array.from(document.querySelectorAll<HTMLElement>(`[data-product-id="${returnId}"]`)).find((element) => element.offsetParent !== null);\n      if (target) target.scrollIntoView({ block: "center", behavior: "auto" });\n      else if (Number.isFinite(savedScroll)) window.scrollTo({ top: savedScroll, left: 0, behavior: "auto" });\n      sessionStorage.removeItem("admin-products-return-id");\n      sessionStorage.removeItem("admin-products-return-scroll");\n    }); });\n  }, [isLoading, products, page]);'
          if anchor not in s: raise SystemExit('clear filters anchor not found')
          s = s.replace(anchor, insert, 1)
          s = s.replace('<Link to={`/admin/products/${product.id}`} className="flex h-[34px] items-center justify-center gap-[5px] rounded-[8px] border border-[#E3E7EC] bg-white text-[8px] font-semibold text-[#69717C]">', '<Link to={`/admin/products/${product.id}`} onClick={() => rememberProductPosition(product.id)} className="flex h-[34px] items-center justify-center gap-[5px] rounded-[8px] border border-[#E3E7EC] bg-white text-[8px] font-semibold text-[#69717C]">', 1)
          s = s.replace('<Link to={`/admin/products/${product.id}`} className="block max-w-[250px] truncate text-[10px] font-semibold text-[#424A54] transition-colors hover:text-[#675CBA]">', '<Link to={`/admin/products/${product.id}`} onClick={() => rememberProductPosition(product.id)} className="block max-w-[250px] truncate text-[10px] font-semibold text-[#424A54] transition-colors hover:text-[#675CBA]">', 1)
          s = s.replace('<Link to={`/admin/products/${product.id}`} aria-label="تعديل المنتج" className="flex h-[30px] w-[30px] items-center justify-center rounded-[8px] border border-[#E3E7EC] bg-white text-[#707884] transition-colors hover:border-[#D7DCE3] hover:bg-[#F7F9FB] hover:text-[#675CBA]">', '<Link to={`/admin/products/${product.id}`} onClick={() => rememberProductPosition(product.id)} aria-label="تعديل المنتج" className="flex h-[30px] w-[30px] items-center justify-center rounded-[8px] border border-[#E3E7EC] bg-white text-[#707884] transition-colors hover:border-[#D7DCE3] hover:bg-[#F7F9FB] hover:text-[#675CBA]">', 1)
          s = s.replace('<article key={product.id} className={cn(', '<article key={product.id} data-product-id={product.id} className={cn(', 1)
          s = s.replace('<tr key={product.id} className={cn("h-[72px] border-b border-[#F0F2F5] transition-colors last:border-b-0 hover:bg-[#FCFDFE]", selected.has(product.id) && "bg-[#FAF9FF]")}>', '<tr key={product.id} data-product-id={product.id} className={cn("h-[72px] border-b border-[#F0F2F5] transition-colors last:border-b-0 hover:bg-[#FCFDFE]", selected.has(product.id) && "bg-[#FAF9FF]")}>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit verified fixes and remove workflow
        run: |
          git config user.name "Mohammed Waleed"
          git config user.email "aiengineer77@icloud.com"
          git add src/pages/admin/AdminProductFormPage.tsx src/pages/admin/AdminProductsPage.tsx
          git rm .github/workflows/temp-admin-product-save-position.yml
          git commit -m "Fix admin product saving and list return position"
          git push origin HEAD:fix/admin-product-save-return-position
