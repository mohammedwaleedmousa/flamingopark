name: Temporary catalog audience fix

on:
  push:
    branches:
      - fix/catalog-audience-categories

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-audience-categories
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply catalog fix
        run: python .github/scripts/apply_catalog_audience_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit fixed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminProductFormPage.tsx src/pages/CategoriesPage.tsx supabase/migrations/20260817160000_add_product_audience_and_catalog_sections.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate product audience from categories"
          git push origin HEAD:fix/catalog-audience-categories
