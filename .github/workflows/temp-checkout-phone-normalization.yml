name: Temporary checkout phone normalization

on:
  push:
    branches:
      - agent/fix-checkout-phone-normalization

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-checkout-phone-normalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply phone fix
        run: python .github/scripts/fix_checkout_phone.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit fixed file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CheckoutPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize checkout phone numbers"
          git push origin HEAD:agent/fix-checkout-phone-normalization
