name: Temp final launch blockers

on:
  push:
    branches:
      - fix/final-launch-blockers

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/final-launch-blockers

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch final blockers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=None):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              actual = s.count(old)
              if actual == 0:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              if count is not None and actual != count:
                  raise SystemExit(f'Unexpected count in {path}: expected {count}, got {actual} for {old[:120]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # Product detail: no public cost price, correct canonical domain/currency, dynamic WhatsApp.
          patch('src/pages/ProductDetailPage.tsx',
                'const WHATSAPP_URL = "https://wa.me/967778579777";',
                'const DEFAULT_WHATSAPP = "967778579777";')
          patch('src/pages/ProductDetailPage.tsx',
                '  const country = "GLOBAL" as any;\n\n  const [selectedImage, setSelectedImage] = useState(0);',
                '''  const country = "GLOBAL" as any;\n\n  const [storeWhatsapp, setStoreWhatsapp] = useState(DEFAULT_WHATSAPP);\n\n  useEffect(() => {\n    let active = true;\n    void supabase.from("site_settings").select("key,value").in("key", ["whatsapp", "whatsapp_ye", "whatsapp_sa"]).then(({ data }) => {\n      if (!active) return;\n      const settings = Object.fromEntries((data || []).map((item) => [item.key, item.value]));\n      const candidate = settings.whatsapp || settings.whatsapp_ye || settings.whatsapp_sa || DEFAULT_WHATSAPP;\n      const digits = String(candidate || "").replace(/\\D/g, "");\n      setStoreWhatsapp(digits || DEFAULT_WHATSAPP);\n    });\n    return () => { active = false; };\n  }, []);\n\n  const whatsappUrl = `https://wa.me/${storeWhatsapp}`;\n\n  const [selectedImage, setSelectedImage] = useState(0);''')
          patch('src/pages/ProductDetailPage.tsx',
                'id,name,name_ar,slug,price,cost_price,original_price,discount,description,description_ar,images,category,category_id,brand,in_stock,stock_quantity,countries,is_featured,is_best_seller,accessories,has_sizes,sizes,features,color_variants,specs,return_policy,has_quality_variants,quality_variants',
                'id,name,name_ar,slug,price,original_price,discount,description,description_ar,images,category,category_id,brand,in_stock,stock_quantity,countries,is_featured,is_best_seller,accessories,has_sizes,sizes,features,color_variants,specs,return_policy,has_quality_variants,quality_variants')
          patch('src/pages/ProductDetailPage.tsx',
                '        costPrice: data.cost_price ? Number(data.cost_price) : undefined,\n',
                '')
          patch('src/pages/ProductDetailPage.tsx',
                '    const siteUrl = "https://flamingopark.store";',
                '    const siteUrl = "https://flamingoparkaden.com";')
          patch('src/pages/ProductDetailPage.tsx',
                '        priceCurrency: "YER",',
                '        priceCurrency: "SAR",')
          patch('src/pages/ProductDetailPage.tsx', 'href={WHATSAPP_URL}', 'href={whatsappUrl}', count=2)

          # Order confirmation: read the same WhatsApp configured in admin/settings.
          patch('src/pages/OrderConfirmationPage.tsx',
                'const STORE_WHATSAPP = "967778579777";',
                'const DEFAULT_WHATSAPP = "967778579777";')
          patch('src/pages/OrderConfirmationPage.tsx',
                '  const [isConfirmed, setIsConfirmed] = useState(false);\n\n  const invoiceRef = useRef<HTMLDivElement>(null);',
                '''  const [isConfirmed, setIsConfirmed] = useState(false);\n  const [storeWhatsapp, setStoreWhatsapp] = useState(DEFAULT_WHATSAPP);\n\n  useEffect(() => {\n    let active = true;\n    void supabase.from("site_settings").select("key,value").in("key", ["whatsapp", "whatsapp_ye", "whatsapp_sa"]).then(({ data }) => {\n      if (!active) return;\n      const settings = Object.fromEntries((data || []).map((item) => [item.key, item.value]));\n      const candidate = settings.whatsapp || settings.whatsapp_ye || settings.whatsapp_sa || DEFAULT_WHATSAPP;\n      const digits = String(candidate || "").replace(/\\D/g, "");\n      setStoreWhatsapp(digits || DEFAULT_WHATSAPP);\n    });\n    return () => { active = false; };\n  }, []);\n\n  const invoiceRef = useRef<HTMLDivElement>(null);''')
          patch('src/pages/OrderConfirmationPage.tsx',
                '    const whatsappUrl = `https://wa.me/${STORE_WHATSAPP}?text=${encodeURIComponent(message)}`;',
                '    const whatsappUrl = `https://wa.me/${storeWhatsapp}?text=${encodeURIComponent(message)}`;')

          # Admin product form: positive sale price + secure cost table.
          patch('src/pages/admin/AdminProductFormPage.tsx',
                "      price < 0 && 'سعر البيع',",
                "      price <= 0 && 'سعر البيع',")
          patch('src/pages/admin/AdminProductFormPage.tsx',
                '''    } else {\n      setSelectedCategoryId(data.category_id || null);''',
                '''    } else {\n      const { data: costRow } = await (supabase as any)\n        .from('product_costs')\n        .select('cost_price')\n        .eq('product_id', data.id)\n        .maybeSingle();\n      setSelectedCategoryId(data.category_id || null);''')
          patch('src/pages/admin/AdminProductFormPage.tsx',
                "        cost_price: data.cost_price?.toString() || '',",
                "        cost_price: costRow?.cost_price?.toString() || '',")
          patch('src/pages/admin/AdminProductFormPage.tsx',
                "      cost_price: formData.cost_price ? parseLocalizedNumber(formData.cost_price) || 0 : 0,\n",
                '')
          patch('src/pages/admin/AdminProductFormPage.tsx',
                '''        savedProductId = inserted.id;\n      }\n\n      // inventory_skus هو مصدر الحقيقة للمخزون.''',
                '''        savedProductId = inserted.id;\n      }\n\n      const secureCost = Math.max(0, formData.cost_price ? parseLocalizedNumber(formData.cost_price) || 0 : 0);\n      const { error: costError } = await (supabase as any)\n        .from('product_costs')\n        .upsert({ product_id: savedProductId, cost_price: secureCost, updated_at: new Date().toISOString() }, { onConflict: 'product_id' });\n      if (costError) throw costError;\n\n      // inventory_skus هو مصدر الحقيقة للمخزون.''')

          # Admin product list/service no longer request the public compatibility cost column.
          patch('src/pages/admin/AdminProductsPage.tsx', '  cost_price: number | null;\n', '')
          patch('src/pages/admin/AdminProductsPage.tsx',
                'id,name,name_ar,slug,price,cost_price,discount,category,category_id,brand,brand_id,in_stock,is_active,countries,images,color_variants,sort_order',
                'id,name,name_ar,slug,price,discount,category,category_id,brand,brand_id,in_stock,is_active,countries,images,color_variants,sort_order')
          patch('src/lib/admin/service.ts',
                'id,name,name_ar,slug,price,cost_price,discount,category,brand,in_stock,is_active,countries,images,sort_order,created_at',
                'id,name,name_ar,slug,price,discount,category,brand,in_stock,is_active,countries,images,sort_order,created_at')

          # Finance report reads costs only from the admin-protected table.
          patch('src/pages/admin/reports/ReportsFinancePage.tsx',
                '      const { data, error } = await supabase.from("products").select("id,cost_price,price");',
                '      const { data, error } = await (supabase as any).from("products").select("id,price,product_costs(cost_price)");')
          patch('src/pages/admin/reports/ReportsFinancePage.tsx',
                '''        ...row,\n        cost_price: row.cost_price == null ? null : Number(row.cost_price),\n        price: Number(row.price || 0),''',
                '''        ...row,\n        cost_price: Number(Array.isArray(row.product_costs) ? row.product_costs[0]?.cost_price || 0 : row.product_costs?.cost_price || 0),\n        price: Number(row.price || 0),''')

          # Inventory page reads protected cost relation and flattens it for existing UI.
          patch('src/pages/admin/AdminInventoryAdjustmentsPage.tsx',
                '      let query = supabase.from("products").select("id,name,name_ar,brand,cost_price,price,stock_quantity,in_stock,is_active,images,color_variants,has_sizes,sizes,has_quality_variants", { count: "exact" });',
                '      let query = (supabase as any).from("products").select("id,name,name_ar,brand,price,stock_quantity,in_stock,is_active,images,color_variants,has_sizes,sizes,has_quality_variants,product_costs(cost_price)", { count: "exact" });')
          patch('src/pages/admin/AdminInventoryAdjustmentsPage.tsx',
                '      return { rows: (data || []) as Product[], total: count || 0 };',
                '''      const rows = (data || []).map((row: any) => ({\n        ...row,\n        cost_price: Number(Array.isArray(row.product_costs) ? row.product_costs[0]?.cost_price || 0 : row.product_costs?.cost_price || 0),\n      }));\n      return { rows: rows as Product[], total: count || 0 };''')

          # Search page should never carry a cost field in the customer model.
          patch('src/pages/SearchPage.tsx',
                '  cost_price?: number | string | null; discount: number | null; description: string | null; description_ar: string | null;',
                '  discount: number | null; description: string | null; description_ar: string | null;')
          patch('src/pages/SearchPage.tsx',
                '  costPrice: data.cost_price === null || data.cost_price === undefined ? undefined : Number(data.cost_price),\n',
                '')

          # Remove admin search links that have no routes.
          patch('src/components/admin/AdminLayout.tsx',
                '  { title: "تجربة عرض المنتج", section: "الكتالوج", url: "/admin/product-experience" },\n',
                '')
          patch('src/components/admin/AdminLayout.tsx',
                '  { title: "خريطة الواجهة", section: "واجهة المتجر", url: "/admin/storefront-map" },\n',
                '')
          patch('src/components/admin/AdminLayout.tsx',
                '  { match: "/admin/product-experience", title: "تجربة عرض المنتج", section: "الكتالوج", exact: true },\n',
                '')
          patch('src/components/admin/AdminLayout.tsx',
                '  { match: "/admin/storefront-map", title: "خريطة الواجهة", section: "واجهة المتجر", exact: true },\n',
                '')

          # Remove duplicate brand section routes, keeping the first pair.
          app = Path('src/App.tsx')
          s = app.read_text(encoding='utf-8')
          pair = '''            <Route path="/brands/:slug/sections/:sectionSlug" element={ <ProtectedRoute><BrandSectionPage /></ProtectedRoute> } />\n            <Route path="/brand/:slug/sections/:sectionSlug" element={ <ProtectedRoute><BrandSectionPage /></ProtectedRoute> } />'''
          if s.count(pair) != 2:
              raise SystemExit(f'Expected duplicated brand section route pair twice, got {s.count(pair)}')
          first = s.find(pair)
          second = s.find(pair, first + len(pair))
          s = s[:second] + s[second + len(pair):]
          app.write_text(s, encoding='utf-8')

          # Add migration source file; final filename is aligned with Supabase after production apply.
          migration = Path('supabase/migrations/20260818104000_final_launch_blockers.sql')
          migration.write_text(r'''-- Final pre-launch hardening: private product costs, positive active prices, public product scope, WhatsApp and links.\n\ncreate table if not exists public.product_costs (\n  product_id uuid primary key references public.products(id) on delete cascade,\n  cost_price numeric not null default 0 check (cost_price >= 0),\n  updated_at timestamptz not null default now()\n);\n\nalter table public.product_costs enable row level security;\ndrop policy if exists "Admins manage product costs" on public.product_costs;\ncreate policy "Admins manage product costs" on public.product_costs\nfor all to authenticated\nusing (public.has_role(auth.uid(), 'admin'::app_role))\nwith check (public.has_role(auth.uid(), 'admin'::app_role));\n\nrevoke all on public.product_costs from anon;\ngrant select, insert, update, delete on public.product_costs to authenticated;\n\ninsert into public.product_costs(product_id, cost_price, updated_at)\nselect id, greatest(0, coalesce(cost_price,0)), now() from public.products\non conflict (product_id) do update set cost_price=excluded.cost_price, updated_at=now();\n\n-- The legacy column stays only as a compatibility shell and never stores sensitive values.\nupdate public.products set cost_price = null where cost_price is not null;\n\ncreate or replace function public.capture_product_cost_price()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = public, auth\nas $$\nbegin\n  if new.cost_price is not null then\n    if auth.uid() is not null and not public.has_role(auth.uid(), 'admin'::app_role) then\n      raise exception 'not_authorized' using errcode='42501';\n    end if;\n    insert into public.product_costs(product_id, cost_price, updated_at)\n    values (new.id, greatest(0, new.cost_price), now())\n    on conflict (product_id) do update set cost_price=excluded.cost_price, updated_at=now();\n    new.cost_price := null;\n  end if;\n  return new;\nend;\n$$;\n\ndrop trigger if exists capture_product_cost_price_trigger on public.products;\ncreate trigger capture_product_cost_price_trigger\nbefore insert or update of cost_price on public.products\nfor each row execute function public.capture_product_cost_price();\n\n-- Public storefront can only read active products. Admin ALL policy still grants admins full rows.\ndrop policy if exists "Products are viewable by everyone" on public.products;\ndrop policy if exists "Active products are viewable by everyone" on public.products;\ncreate policy "Active products are viewable by everyone" on public.products\nfor select to public using (is_active = true);\n\n-- Never expose/order a zero-priced active product.\nupdate public.products set is_active=false where coalesce(price,0) <= 0;\nalter table public.products drop constraint if exists products_active_price_positive;\nalter table public.products add constraint products_active_price_positive\ncheck (is_active is not true or (price is not null and price > 0));\n\ncreate or replace function public.get_inventory_summary()\nreturns table(total_products bigint, active_products bigint, total_units bigint, inventory_value numeric, low_stock bigint, out_of_stock bigint, sku_tracked bigint)\nlanguage sql\nsecurity definer\nset search_path to 'public', 'auth'\nas $$\n  select\n    count(*)::bigint,\n    count(*) filter (where p.is_active is true)::bigint,\n    coalesce(sum(greatest(0,p.stock_quantity)),0)::bigint,\n    coalesce(sum(greatest(0,p.stock_quantity) * greatest(0,coalesce(pc.cost_price,0))),0)::numeric,\n    count(*) filter (where p.stock_quantity between 1 and 3)::bigint,\n    count(*) filter (where p.stock_quantity = 0)::bigint,\n    count(*) filter (where exists (select 1 from public.inventory_skus s where s.product_id=p.id and s.is_default=false))::bigint\n  from public.products p\n  left join public.product_costs pc on pc.product_id=p.id\n  where public.has_role(auth.uid(), 'admin'::app_role);\n$$;\n\ncreate or replace function public.apply_inventory_adjustment(p_product_id uuid, p_adjustment_type text, p_quantity integer, p_reason text, p_reference text default null, p_notes text default null, p_inventory_sku_id uuid default null)\nreturns public.inventory_adjustments\nlanguage plpgsql\nsecurity definer\nset search_path to 'public', 'auth'\nas $$\ndeclare\n  v_product public.products%rowtype; v_sku public.inventory_skus%rowtype; v_sku_count integer;\n  v_before integer; v_after integer; v_change integer; v_product_before integer; v_product_after integer;\n  v_unit_cost numeric; v_adjustment public.inventory_adjustments%rowtype;\nbegin\n  if auth.uid() is null or not public.has_role(auth.uid(), 'admin'::app_role) then raise exception 'غير مصرح بتنفيذ تسويات المخزون' using errcode='42501'; end if;\n  if p_product_id is null then raise exception 'المنتج مطلوب'; end if;\n  if p_adjustment_type not in ('increase','decrease','recount','damage') then raise exception 'نوع التسوية غير صالح'; end if;\n  if nullif(btrim(coalesce(p_reason,'')),'') is null then raise exception 'سبب التسوية مطلوب'; end if;\n  if p_quantity is null then raise exception 'الكمية مطلوبة'; end if;\n  if p_adjustment_type='recount' and p_quantity<0 then raise exception 'كمية الجرد لا يمكن أن تكون سالبة'; end if;\n  if p_adjustment_type<>'recount' and p_quantity<=0 then raise exception 'الكمية يجب أن تكون أكبر من صفر'; end if;\n  select * into v_product from public.products where id=p_product_id for update;\n  if not found then raise exception 'المنتج غير موجود'; end if;\n  v_product_before:=greatest(0,coalesce(v_product.stock_quantity,0));\n  select greatest(0,coalesce(cost_price,0)) into v_unit_cost from public.product_costs where product_id=p_product_id;\n  v_unit_cost:=coalesce(v_unit_cost,0);\n  select count(*) into v_sku_count from public.inventory_skus where product_id=p_product_id;\n  if v_sku_count=0 then insert into public.inventory_skus(product_id,variant_key,label,stock_quantity,is_default) values(p_product_id,'default','غير موزع على الخيارات',v_product_before,true) returning * into v_sku; v_sku_count:=1; end if;\n  if p_inventory_sku_id is not null then\n    select * into v_sku from public.inventory_skus where id=p_inventory_sku_id and product_id=p_product_id for update;\n    if not found then raise exception 'خيار المخزون المحدد غير موجود'; end if;\n  else\n    select * into v_sku from public.inventory_skus where product_id=p_product_id and is_default=true order by created_at limit 1 for update;\n    if not found then\n      if v_sku_count=1 then select * into v_sku from public.inventory_skus where product_id=p_product_id limit 1 for update;\n      else raise exception 'هذا المنتج موزع على عدة خيارات. اختر اللون أو المقاس المطلوب.'; end if;\n    end if;\n  end if;\n  v_before:=greatest(0,coalesce(v_sku.stock_quantity,0));\n  case p_adjustment_type\n    when 'increase' then v_change:=p_quantity; v_after:=v_before+p_quantity;\n    when 'decrease' then if p_quantity>v_before then raise exception 'لا يمكن إنقاص % قطعة، مخزون الخيار الحالي هو % فقط',p_quantity,v_before; end if; v_change:=-p_quantity; v_after:=v_before-p_quantity;\n    when 'damage' then if p_quantity>v_before then raise exception 'كمية التالف أكبر من مخزون الخيار الحالي'; end if; v_change:=-p_quantity; v_after:=v_before-p_quantity;\n    when 'recount' then v_after:=p_quantity; v_change:=v_after-v_before;\n  end case;\n  update public.inventory_skus set stock_quantity=v_after where id=v_sku.id;\n  select stock_quantity into v_product_after from public.products where id=p_product_id;\n  insert into public.inventory_adjustments(product_id,product_name,inventory_sku_id,variant_label,adjustment_type,quantity_before,quantity_change,quantity_after,product_quantity_before,product_quantity_after,unit_cost,total_cost,reason,reference,notes,created_by)\n  values(v_product.id,v_product.name_ar,v_sku.id,v_sku.label,p_adjustment_type,v_before,v_change,v_after,v_product_before,v_product_after,v_unit_cost,abs(v_change)*v_unit_cost,btrim(p_reason),nullif(btrim(coalesce(p_reference,'')),''),nullif(btrim(coalesce(p_notes,'')),''),auth.uid()) returning * into v_adjustment;\n  return v_adjustment;\nend;\n$$;\n\ninsert into public.site_settings(key,value) values\n('whatsapp','"+967778579777"'::jsonb),\n('whatsapp_ye','"+967778579777"'::jsonb),\n('whatsapp_sa','"+967778579777"'::jsonb)\non conflict (key) do update set value=excluded.value;\n\nupdate public.homepage_sections set view_all_link='/seasonal-offers' where view_all_link='/offers';\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit verified fixes and remove workflow
        if: success()
        run: |
          git config user.name "Mohammed Waleed"
          git config user.email "aiengineer77@icloud.com"
          git rm .github/workflows/temp-final-launch-blockers.yml
          git add src supabase/migrations
          git commit -m "Fix final launch blockers"
          git push origin HEAD:fix/final-launch-blockers
