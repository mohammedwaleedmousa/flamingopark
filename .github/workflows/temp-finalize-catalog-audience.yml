name: Finalize catalog audience

on:
  push:
    branches:
      - fix/catalog-audience-categories

permissions:
  contents: write

jobs:
  finalize-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-audience-categories
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Final cleanup
        run: python .github/scripts/finalize_catalog_audience_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit final source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminCategoriesPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Hide audience sections from category list"
          git push origin HEAD:fix/catalog-audience-categories
