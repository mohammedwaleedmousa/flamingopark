name: Temporary admin categories runtime fix

on:
  push:
    branches:
      - fix/admin-categories-runtime

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-categories-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply runtime fix
        run: python .github/scripts/fix_admin_categories_runtime.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminCategoriesPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix admin categories runtime crash"
          git push origin HEAD:fix/admin-categories-runtime
