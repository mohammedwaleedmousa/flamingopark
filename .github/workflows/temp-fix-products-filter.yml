name: Temporary products filter fix

on:
  push:
    branches:
      - fix/products-filter-button

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/products-filter-button

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove broken metadata warm call
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ProductsPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''    /*
           * لو لم يبدأ Metadata بعد، ابدأه فوراً.
           */
          setMetadataWarm(true);

          setFiltersOpen(true);'''
          if old not in s:
              raise SystemExit('Target filter block was not found')
          s = s.replace(old, '    setFiltersOpen(true);', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name "Mohammed Waleed"
          git config user.email "aiengineer77@icloud.com"
          git add src/pages/ProductsPage.tsx
          git rm .github/workflows/temp-fix-products-filter.yml
          git commit -m "Fix products filter button"
          git push origin HEAD:fix/products-filter-button
