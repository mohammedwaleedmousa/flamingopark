name: Temp launch readiness build

on:
  push:
    branches:
      - fix/launch-readiness-final

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/launch-readiness-final

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "Mohammed Waleed"
          git config user.email "aiengineer77@icloud.com"
          git rm .github/workflows/temp-launch-readiness-final.yml
          git commit -m "Remove temporary launch readiness workflow"
          git push origin HEAD:fix/launch-readiness-final
