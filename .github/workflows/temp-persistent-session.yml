name: Temporary persistent session verifier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.event.pull_request.head.ref == 'fix/yemen-default-persistent-session'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yemen-default-persistent-session
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply session patch
        run: python .github/scripts/apply_persistent_session_defaults.py
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit verified session fix
        run: |
          rm -f .github/scripts/apply_persistent_session_defaults.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep customer sessions persistent with Yemen defaults"
          git pull --rebase origin fix/yemen-default-persistent-session
          git push origin HEAD:fix/yemen-default-persistent-session
