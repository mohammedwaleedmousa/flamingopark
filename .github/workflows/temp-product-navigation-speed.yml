name: Temporary product navigation speed

on:
  push:
    branches:
      - fix/products-detail-navigation-speed

permissions:
  contents: write

jobs:
  optimize-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/products-detail-navigation-speed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply navigation optimization
        run: python .github/scripts/optimize_product_navigation.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit optimized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProductsPage.tsx src/components/ProductCard.tsx src/lib/prefetchRoutes.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Speed up product detail navigation"
          git push origin HEAD:fix/products-detail-navigation-speed
